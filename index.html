<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>متجر مجوره متوقف مؤقتًا</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      color: #000;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }
    main { max-width: 700px; }
    h1 { margin: 0 0 18px; font-size: clamp(28px, 5vw, 42px); font-weight: 800; }
    p { margin: 10px 0; font-size: clamp(18px, 3.5vw, 24px); line-height: 1.9; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>نعتذر منكم ❤️</h1>
    <p>متجر مجوره متوقف حاليًا، برجاء عدم استخدام الموقع في الوقت الحالي.</p>
    <p>شكرًا لتفهمكم.</p>
  </main>
</body>
</html>
